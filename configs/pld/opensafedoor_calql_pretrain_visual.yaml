env:
  CUDA_VISIBLE_DEVICES: "1"
  PYTORCH_ALLOC_CONF: expandable_segments:True

script: scripts/pld/pretrain_calql_critic.py

args:
  env-id: OpenSafeDoor-v2
  offline-h5-dir: dataset/Pi0_rollout_OpenSafeDoor-v2
  output-dir: outputs/pld/rollout_pretrain_visual
  updates: 5000
  batch-size: 64
  calql-alpha: 0.5
  calql-n-actions: 1
  wandb-enabled: true
  wandb-project: maniskill-pld
  wandb-name: opensafedoor_calql_pretrain_visual
  use-visual-rl: true
  rl-image-size: 128
  device: cuda:0
  checkpoint-name: calql_critic.pt
