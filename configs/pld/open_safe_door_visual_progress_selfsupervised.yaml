script: scripts/pld/train_visual_progress_selfsupervised.py

env:
  CUDA_VISIBLE_DEVICES: "1"

args:
  env-id: OpenSafeDoor-v2
  control-mode: pd_joint_pos
  offline-h5-dir: dataset/Pi0_rollout_OpenSafeDoor-v2_pd_joint_pos
  image-keys:
    - sensor_data/base_camera/rgb
    - sensor_data/hand_camera/rgb
  image-size: 96
  # Door opening has two visually distinct interactions (button then handle),
  # so use a slightly longer causal clip and denser full-trajectory sampling.
  context-frames: 4
  context-stride: 3
  sequence-points: 10
  validation-fraction: 0.1
  train-samples-per-epoch: 50000
  validation-samples: 128

  device: cuda:0
  seed: 0
  updates: 4000
  batch-size: 4
  num-workers: 8
  ensemble-size: 3
  lr: 0.0003
  weight-decay: 0.0001
  visual-latent-dim: 256
  embedding-dim: 128
  hidden-dim: 256
  grad-clip-norm: 1.0
  augmentation-strength: 0.1
  amp: true
  log-every: 25
  eval-every: 250
  max-validation-batches: 0

  cycle-temperature: 0.1
  order-margin: 0.02
  preference-margin: 0.2
  cycle-weight: 1.0
  alignment-weight: 0.5
  endpoint-weight: 2.0
  order-weight: 1.0
  latent-smoothness-weight: 0.05
  smoothness-weight: 0.1
  success-weight: 1.0
  preference-weight: 0.5

  output-dir: outputs/pld/OpenSafeDoor-v2/visual_progress_implicit
  checkpoint-name: visual_progress_best.pt
  wandb-enabled: true
  wandb-project: maniskill-pld
  wandb-name: door_visual_progress_implicit
  wandb-mode: disabled
