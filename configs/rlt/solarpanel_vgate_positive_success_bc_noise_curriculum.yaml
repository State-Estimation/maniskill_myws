schema: solarpanel_vgate_positive_success_bc_noise_curriculum_v1
objective: >-
  Resume the validated seed44900 Positive Success BC checkpoint at 20,495
  environment steps and anneal exploration strength before converging at 200k.

initialization:
  mode: exact_snapshot_resume
  checkpoint: >-
    outputs/rlt/SolarPanelStatic-v2_vgate_successbc_positive_seed44900_macro_budget100_pilot20k/value_guided_bandit.pt
  replay: >-
    outputs/rlt/SolarPanelStatic-v2_vgate_successbc_positive_seed44900_macro_budget100_pilot20k/online_bandit_replay.npz
  trainer_state: >-
    outputs/rlt/SolarPanelStatic-v2_vgate_successbc_positive_seed44900_macro_budget100_pilot20k/trainer_state.json
  resume_env_steps: 20495
  rl_checkpoint_before_seed44900: null

task:
  env_id: SolarPanelStatic-v2
  reward_mode: sparse
  control_mode: pd_joint_pos
  max_episode_steps: 500
  chunk_len: 10

value_model:
  checkpoint: outputs/rlt/value/SolarPanelStatic-v2_safe_visual_recap_value_seed41000/value_best.pt
  frozen_during_online_training: true
  uses_environment_reward: false
  uses_process_reward: false

gate:
  enter_failure_probability: 0.65
  immediate_failure_probability: 0.85
  exit_failure_probability: 0.25
  enter_confirm_chunks: 2
  exit_confirm_chunks: 2
  latest_entry_step: 400
  max_intervention_env_steps: 100

exploration:
  mode: macro_knots
  knots: 6
  burst_chunks: 5
  max_bursts_per_episode: 2
  burst_cooldown_chunks: 5
  noise_curriculum:
    start: 0.30
    end: 0.10
    hold_until_env_step: 20000
    anneal_steps: 100000
    constant_after_env_step: 120000
  background_probe_curriculum:
    start_probability: 0.80
    end_probability: 0.25
    hold_until_env_step: 20000
    anneal_steps: 100000
    constant_after_env_step: 120000
    max_chunks_per_episode: 5
    max_boundary: 15
    min_value_improvement: -0.20

learning:
  actor_value_objective_weight: 0.0
  actor_awr_weight: 0.0
  actor_l2_weight: 0.10
  actor_smoothness_weight: 0.20
  actor_success_bc_weight: 10.0
  actor_success_bc_min_value_improvement: 0.01
  actor_success_credit_mode: chunk_threshold
  scorer_target: one_step_frozen_value_improvement

deployment:
  training_actor_max_consecutive_chunks: 0
  evaluation_actor_max_consecutive_chunks: 2
  evaluation_actor_cooldown_chunks: 3

training:
  seed: 44900
  target_total_env_steps: 200000
  wandb_project: maniskill-vgate-advantage-bc
  wandb_run_name: panel-positivebc-seed44900-noise-curriculum-resume200k

output_dir: >-
  outputs/rlt/SolarPanelStatic-v2_vgate_successbc_positive_seed44900_noise_curriculum_resume200k
