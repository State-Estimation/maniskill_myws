schema: solarpanel_goal95_preregistered_training_v1
date: 2026-07-28
status: stopped_failed_continuation_gate
objective: >-
  Test whether retaining Pi0's model-native temporal action-suffix hidden tokens
  supplies the missing visual-action information needed to improve residual
  proposal coverage, without training an RLToken, using PCA, changing reward,
  or changing the Base action chunk.
starting_artifacts:
  checkpoint: >-
    outputs/rlt/SolarPanelStatic-v2_goal95_causal_td3_seed2000_150k/frozen_latent_residual.pt
  replay: >-
    outputs/rlt/SolarPanelStatic-v2_goal95_causal_td3_seed2000_150k/online_replay.npz
hypothesis: >-
  The current global mean latent discards the ordering of Pi0's 50 final-denoise
  action-suffix tokens. Adding five ordered ten-token pools through a zero-gated
  lightweight adapter should preserve the deployed 84-percent policy at
  initialization while allowing the critic to learn context-specific corrective
  directions from new causal online samples. On one fresh paired development set
  it should reach at least 90 task successes and 94 grasps, retain at least a
  ten-point gain over Base, and cause at most two regressions.
representation:
  parent: frozen_pi0_action_suffix_mean_v1
  source: final_denoise_action_expert_hidden
  action_horizon: 50
  ordered_bins: 5
  tokens_per_bin: 10
  hidden_dim: 1024
  adapter_bottleneck: 64
  exact_mean_retained: true
  temporal_adapter_gate_initialization: zero
  old_replay_conversion: repeat_exact_mean_with_zero_temporal_contrast
  old_optimizer_state_reused: false
  old_readiness_counters_reused: false
algorithm:
  family: frozen_latent_td3
  selector: conservative_twin_q
  chunk_len: 50
  actor_warmup: critic_only_for_1000_updates
  independent_online_exploration: true
  exploration_probability_per_eligible_boundary: 0.35
  exploration_normalized_std: 0.30
  base_control_episode_probability: 0.20
  replay_nonzero_fraction: 0.50
  replay_nonzero_success_fraction: 0.50
  max_interventions_per_episode: 2
  intervention_cooldown_chunks: 1
  min_q_advantage_at_deployment: 0.10
  changes_reward_or_success_condition: false
  uses_candidate_rollouts: false
  uses_pca: false
environment:
  env_id: SolarPanelStatic-v2
  obs_mode: rgb
  reward_mode: sparse
  control_mode: pd_joint_pos
  sim_backend: physx_cpu
  render_backend: sapien_cuda:0
  enhanced_determinism: false
  max_episode_steps: 500
training:
  seed: 5000
  new_env_step_budget: 100000
  batch_size: 128
  updates_per_chunk: 2
  buffer_capacity: 50000
  critic_warmup_updates: 1000
  checkpoint_selection: final_only
